# Mises à jour automatiques, une PR groupée par semaine et par écosystème (peu de bruit).
# Les versions majeures sont ignorées ici : elles se traitent à la main (starlette/fastapi,
# react-scripts...). Les alertes de sécurité GitHub restent actives à part.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Paris }
    open-pull-requests-limit: 3
    groups:
      python-minor-patch: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: [dependances]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Paris }
    open-pull-requests-limit: 3
    groups:
      front-minor-patch: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: [dependances]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Paris }
    open-pull-requests-limit: 2
    groups:
      actions: { patterns: ["*"] }
    labels: [dependances]
