name: CI infra (lint, migrations, secrets)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-infra-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install flake8
        run: pip install flake8
      - name: Flake8 (blocking errors only)
        run: flake8 backend --select=E9,F63,F7,F82 --show-source
      - name: Shell syntax check
        run: |
          set -e
          find . -type f -name '*.sh' -print0 | xargs -0 -n1 sh -n

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway CI env file
        working-directory: ovh-ai-stack-corrige/preprod
        run: |
          set -e
          cp .env.preprod.example .env.preprod
          for VAR in POSTGRES_PASSWORD PREPROD_APP_DB_PASSWORD REDIS_PASSWORD; do
            VAL=$(openssl rand -hex 16)
            sed -i "s|^${VAR}=.*|${VAR}=${VAL}|" .env.preprod
          done
          JWT_VAL=$(openssl rand -hex 32)
          FERNET_VAL=$(python3 -c 'import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=${JWT_VAL}|" .env.preprod
          sed -i "s|^APP_ENCRYPTION_KEY=.*|APP_ENCRYPTION_KEY=${FERNET_VAL}|" .env.preprod
          chmod 600 .env.preprod
      - name: Validate env (reject production-looking secrets)
        working-directory: ovh-ai-stack-corrige/preprod
        run: ./scripts/validate-env.sh
      - name: Start infra services (postgres, redis)
        working-directory: ovh-ai-stack-corrige/preprod
        run: docker compose --env-file .env.preprod up -d --build postgres redis
      - name: Wait for services to be healthy
        working-directory: ovh-ai-stack-corrige/preprod
        run: |
          set -e
          for i in $(seq 1 30); do
            ./scripts/healthcheck.sh && exit 0
            sleep 5
          done
          echo "Services did not become healthy in time" >&2
          docker compose --env-file .env.preprod logs
          exit 1
      - name: Dry-run migrations
        working-directory: ovh-ai-stack-corrige/preprod
        run: ./scripts/migrate.sh
      - name: Build backend image
        working-directory: ovh-ai-stack-corrige/preprod
        run: docker compose --env-file .env.preprod --profile app build api
      - name: Apply migrations to disposable CI database
        working-directory: ovh-ai-stack-corrige/preprod
        run: ./scripts/migrate.sh --apply
      - name: Start API and worker
        working-directory: ovh-ai-stack-corrige/preprod
        run: docker compose --env-file .env.preprod --profile app up -d
      - name: Smoke-test API and worker
        working-directory: ovh-ai-stack-corrige/preprod
        run: ./scripts/smoke-test.sh
      - name: Encrypted backup and restore verification
        working-directory: ovh-ai-stack-corrige/preprod
        run: |
          set -euo pipefail
          echo "BACKUP_ENCRYPTION_PASSPHRASE=$(openssl rand -hex 32)" >> .env.preprod
          ./scripts/backup-preprod.sh
          backup=$(find backups -maxdepth 1 -type f -name '*.dump.enc' -print -quit)
          [ -n "$backup" ] || exit 1
          ./scripts/restore-preprod.sh "$backup"
      - name: Diagnostic logs if app or restore fails
        if: failure()
        working-directory: ovh-ai-stack-corrige/preprod
        run: docker compose --env-file .env.preprod --profile app logs --tail=150 api worker postgres redis
      - name: Tear down
        if: always()
        working-directory: ovh-ai-stack-corrige/preprod
        run: docker compose --env-file .env.preprod --profile app down -v --remove-orphans

  secrets:
    runs-on: ubuntu-latest
    # gitleaks-action v2 lit la liste des commits de la PR via l'API GitHub :
    # sans `pull-requests: read`, l'appel echoue en 403 « Resource not
    # accessible by integration » et le controle tombe en echec sans avoir
    # analyse quoi que ce soit.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
