# Hermes Agent — PASSERELLE IA UNIQUE du SaaS Blueseatra (29/09/2026).
# Le SaaS n'appelle plus jamais Ollama directement : OCR (PaddleOCR-VL par défaut),
# extraction, décomposition, rédaction et Mistral passent tous par
# POST /v1/chat/completions de cet agent, avec "provider" + "model" par requête :
#   custom:ollama  -> modèles locaux du VPS (conteneur ollama)
#   custom:mistral -> API Mistral (UE), clé MISTRAL_API_KEY du .env
# Le profil "hermes" de compose.yaml doit donc être démarré en production.
# Tous les slots pointent vers le MÊME petit modèle -> aucun thrashing (MAX_LOADED_MODELS).
model:
  provider: custom
  default: qwen2.5:7b
  base_url: http://ollama:11434/v1
  api_key: ollama-local
  api_mode: chat_completions

# Mistral AI (API, hébergée dans l'UE) — ticket #88, remplace Cerebras.
# Le SaaS choisit ce fournisseur requête par requête (champ "provider":
# "custom:mistral" + "model": "mistral-medium-latest"). La clé reste sur le
# VPS : variable MISTRAL_API_KEY du fichier .env, jamais dans ce fichier.
providers:
  # Modèles locaux du VPS (OCR PaddleOCR-VL, GLM-OCR, LightOnOCR, qwen2.5vl, qwen2.5, gpt-oss…).
  ollama:
    name: Ollama (VPS)
    api: http://ollama:11434/v1
    api_key: ollama-local
    transport: chat_completions
    default_model: qwen2.5:7b
  mistral:
    name: Mistral AI
    api: https://api.mistral.ai/v1
    key_env: MISTRAL_API_KEY
    transport: chat_completions
    default_model: mistral-medium-latest
    models:
      mistral-medium-latest:
        context_length: 128000
      mistral-large-latest:
        context_length: 128000
      mistral-small-latest:
        context_length: 128000

# Pas de mode raisonnement lourd sur CPU.
# Mode « passerelle » : le SaaS envoie des documents clients (contenu non fiable).
# Aucun outil n'est laissé à l'agent (pas de terminal, fichiers, web, mémoire…),
# il ne fait que transmettre au modèle choisi et renvoyer sa réponse.
# Vérifier après démarrage : curl -H "Authorization: Bearer $API_SERVER_KEY" http://hermes:8642/v1/toolsets
agent:
  reasoning_effort: none
  disabled_toolsets:
    - terminal
    - file
    - web
    - search
    - x_search
    - browser
    - code_execution
    - delegation
    - cronjob
    - memory
    - session_search
    - skills
    - todo
    - vision
    - video
    - image_gen
    - video_gen
    - tts
    - computer_use
    - connections
    - homeassistant
    - kanban
    - spotify

# Secours local uniquement (jamais provider: auto -> sortie UE interdite ; Mistral est
# hébergé dans l'UE et n'est utilisé que sur demande explicite du SaaS).
fallback_providers:
  - provider: custom
    model: hermes3
    base_url: http://ollama:11434/v1
    key_env: OPENAI_API_KEY

auxiliary:
  vision:
    provider: main
    model: qwen2.5vl:7b
    base_url: http://ollama:11434/v1
    api_key: ollama-local
    reasoning_effort: none
    max_concurrency: 1

delegation:
  base_url: http://ollama:11434/v1
  api_key: ollama-local
  model: qwen2.5:7b
  api_mode: chat_completions
  max_concurrent_children: 1
  orchestrator_enabled: false

gateway:
  api_server:
    enabled: true
    host: "0.0.0.0"
    port: 8642
    max_concurrent_runs: 2
    # Honorer le modèle demandé par le SaaS (sinon ignoré sans "provider").
    direct_model_requests: true
