# ============================================================
# Render Blueprint — Blueseatra
# https://render.com/docs/blueprint-spec
# ============================================================
# IMPORTANT : Ne jamais committer les valeurs sensibles ici.
# Les secrets (DATABASE_URL, SUPABASE_SERVICE_ROLE_KEY, JWT_SECRET,
# APP_ENCRYPTION_KEY) doivent être renseignés dans
# Render Dashboard > Environment > Secret Files / Env Vars.
# ============================================================

services:

  # ----------------------------------------------------------
  # Backend FastAPI — API Blueseatra
  # ----------------------------------------------------------
  - type: web
    name: blueseatra-api
    runtime: python
    region: frankfurt  # eu-central-1 — proche de Supabase eu-west-1 (Ireland)
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health

    envVars:

      # --- Database : Supabase Transaction Pooler (port 6543) ---
      # Format : postgresql+asyncpg://postgres.xmsxlochasjauhnxarvc:[MOT_DE_PASSE]@aws-0-eu-west-1.pooler.supabase.com:6543/postgres
      # → À renseigner dans Render Dashboard > Environment (Secret)
      - key: DATABASE_URL
        sync: false

      # --- Supabase API ---
      - key: SUPABASE_URL
        value: https://xmsxlochasjauhnxarvc.supabase.co

      # Clé anon (publique) — sûr de committer
      - key: SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhtc3hsb2NoYXNqYXVobnhhcnZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwNzU5MDAsImV4cCI6MjA5NzY1MTkwMH0.RCSODn4zjqsgAxAelkSN24YWSDVUrbNaQruQ6Xa22_w

      # Clé publishable moderne (recommandée pour les nouveaux modules)
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_CyUMx3b07aIaDDq99VixKw_pHp7t4WU

      # Service role key — ultra-sensible, JAMAIS dans le code
      # → À renseigner dans Render Dashboard > Environment (Secret)
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # --- App secrets ---
      # Générer : python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: JWT_SECRET
        sync: false

      # Générer : python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: APP_ENCRYPTION_KEY
        sync: false

      # --- IA : Hermes / Ollama derrière Caddy (repo ovh-ai-stack) ---
      # HTTPS uniquement. Ne jamais pointer vers :11434.
      - key: HERMES_BASE_URL
        value: https://ia.blueseatra.com

      - key: HERMES_DEFAULT_MODEL
        value: hermes-3

      - key: HERMES_API_KEY
        sync: false

      # --- CORS ---
      # Ajouter l'URL réelle du frontend une fois déployé
      - key: CORS_ORIGINS
        value: https://blueseatra.com,https://blueseatra-frontend.onrender.com

      # --- Schema PostgreSQL ---
      - key: DB_SCHEMA
        value: public

      # --- Taille max upload (15 Mo) ---
      - key: MAX_UPLOAD_SIZE
        value: "15728640"

      # --- Python env ---
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ----------------------------------------------------------
  # Frontend (décommenter si hébergé sur Render)
  # Laisser commenté si le frontend est sur Vercel / Netlify
  # ----------------------------------------------------------
  # - type: web
  #   name: blueseatra-frontend
  #   runtime: static
