  #       value: https://xmsxlochasjauhnxarvc.supabase.co
  #     - key: VITE_SUPABASE_ANON_KEY
  #       value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhtc3hsb2NoYXNqYXVobnhhcnZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwNzU5MDAsImV4cCI6MjA5NzY1MTkwMH0.RCSODn4zjqsgAxAelkSN24YWSDVUrbNaQruQ6Xa22_w
