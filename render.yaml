# ============================================================
# Render Blueprint — Blueseatra backend (FastAPI)
# Docs: https://render.com/docs/blueprint-spec
# Deploy: Render Dashboard > New > Blueprint > connect this repo.
# Secrets (DATABASE_URL, JWT_SECRET, ...) are set in the Render
# dashboard, NOT committed here.
# ============================================================
services:
  - type: web
    name: blueseatra-api
    runtime: python
    region: frankfurt          # closest to Supabase eu-west-1 (Ireland)
    plan: free                 # free tier: sleeps after ~15 min idle
    rootDir: backend           # the FastAPI app lives in /backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    autoDeploy: true           # redeploy on every push to the default branch
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # ---- Secrets below: set their values in the Render dashboard ----
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA
        value: blueseatra
      - key: SUPABASE_URL
        value: https://xmsxlochasjauhnxarvc.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      # Comma-separated list of allowed frontend origins (no trailing slash).
      # e.g. https://blueseatra.com,https://www.blueseatra.com
      - key: CORS_ORIGINS
        sync: false
