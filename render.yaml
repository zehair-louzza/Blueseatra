# ============================================================
# Render Blueprint — Blueseatra
# https://render.com/docs/blueprint-spec
# ============================================================
# IMPORTANT : Ne jamais committer les valeurs sensibles ici.
# Les secrets (DATABASE_URL, SUPABASE_SERVICE_ROLE_KEY, JWT_SECRET,
# APP_ENCRYPTION_KEY, HERMES_API_KEY, HERMES_GATEWAY_KEY, MCP_API_KEY,
# REDIS_URL) doivent être renseignés dans Render Dashboard > chaque
# service > Environment. Render interdit `sync: false` dans un
# envVarGroup (la valeur doit venir du Dashboard PAR service) : ils sont
# donc déclarés individuellement sur chaque service ci-dessous plutôt
# que dans le groupe partagé, qui ne contient que des valeurs littérales.
# ============================================================

# Groupe d'env partagé (valeurs non sensibles uniquement) entre l'API et
# le worker d'extraction : les deux processus importent server.py et
# doivent donc voir la même config modèles/IA. Source du bug du
# 2026-08-23 : HERMES_EXTRACT_MODEL/HERMES_REASONING_MODEL/HERMES_VISION_MODEL
# pointaient encore vers des modeles supprimes du VPS, uniquement parce
# qu'ils etaient dupliques en dur sans etre synchronises.
envVarGroups:
  - name: blueseatra-shared
    envVars:
      - key: SUPABASE_URL
        value: https://xmsxlochasjauhnxarvc.supabase.co

      # Clé anon (publique) — sûr de committer
      - key: SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhtc3hsb2NoYXNqYXVobnhhcnZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwNzU5MDAsImV4cCI6MjA5NzY1MTkwMH0.RCSODn4zjqsgAxAelkSN24YWSDVUrbNaQruQ6Xa22_w

      # Clé publishable moderne (recommandée pour les nouveaux modules)
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_CyUMx3b07aIaDDq99VixKw_pHp7t4WU

      # --- IA : Hermes / Ollama derrière Caddy (repo ovh-ai-stack) ---
      # HTTPS uniquement. Ne jamais pointer vers :11434.
      - key: HERMES_BASE_URL
        value: https://ia.blueseatra.com

      - key: HERMES_DEFAULT_MODEL
        value: hermes-3

      # 2026-08-23 : gemma4:26b, qwen3.6:27b, qwen3:14b, deepseek-r1:14b,
      # qwen2.5:14b et Phi-4-reasoning-vision-15B ont ete supprimes du VPS
      # (63 Go liberes). Valeurs alignees sur les defauts de ai_service.py
      # (voir PR #44) : qwen2.5:7b (texte) / qwen2.5vl:7b (vision, seul
      # modele multimodal restant sur le VPS).
      - key: HERMES_EXTRACT_MODEL
        value: qwen2.5:7b

      - key: HERMES_REASONING_MODEL
        value: qwen2.5vl:7b

      # Modele utilise pour toute extraction avec image (photo, PDF au calque
      # texte illisible rendu en image). DOIT etre un modele multimodal
      # installe sur le VPS (verifie via `ollama show <modele>` -> Capabilities
      # doit lister "vision"). qwen2.5:7b et hermes3/hermes-3 sont texte seul
      # et renvoient HTTP 400 si on leur envoie une image (incident 2026-08-18).
      - key: HERMES_VISION_MODEL
        value: qwen2.5vl:7b

      - key: HERMES_GATEWAY_URL
        value: https://hermes.blueseatra.com

      - key: HERMES_GATEWAY_MODEL
        value: hermes-agent

      # Tenant ANELEC Test — pas un secret, requis pour le MCP Perplexity
      - key: MCP_TENANT_ID
        value: "9171d808-f7ee-4d51-92f6-db60d93d8ecc"

      # --- Schema PostgreSQL ---
      - key: DB_SCHEMA
        value: public

      # --- Python env ---
      - key: PYTHON_VERSION
        value: "3.11.0"

services:

  # ----------------------------------------------------------
  # Backend FastAPI — API Blueseatra
  # ----------------------------------------------------------
  - type: web
    name: blueseatra-api
    runtime: python
    region: frankfurt  # eu-central-1 — proche de Supabase eu-west-1 (Ireland)
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health

    envVars:
      - fromGroup: blueseatra-shared

      # --- Secrets : à renseigner dans Render Dashboard > Environment ---
      # Format : postgresql+asyncpg://postgres.xmsxlochasjauhnxarvc:[MOT_DE_PASSE]@aws-0-eu-west-1.pooler.supabase.com:6543/postgres
      - key: DATABASE_URL
        sync: false

      # Service role key — ultra-sensible, JAMAIS dans le code
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Générer : python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: JWT_SECRET
        sync: false

      # Générer : python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: APP_ENCRYPTION_KEY
        sync: false

      - key: HERMES_API_KEY
        sync: false

      - key: HERMES_GATEWAY_KEY
        sync: false

      # --- File durable (opt-in) : voir backend/extraction_worker.py. ---
      # Laisser VIDE (ne pas renseigner) tant que le service worker
      # ci-dessous n'a pas ete verifie actif (logs Render du service
      # blueseatra-extraction-worker) : sans REDIS_URL, create_request()
      # retombe automatiquement sur l'ancien comportement in-process, donc
      # aucun risque a la laisser non definie. La renseigner ici active
      # aussi la file cote worker (meme valeur requise sur les deux
      # services -- voir plus bas).
      - key: REDIS_URL
        sync: false

      # Connecteur MCP Perplexity (https://blueseatra-api.onrender.com/mcp)
      - key: MCP_API_KEY
        sync: false

      # --- CORS (specifique a l'API, le worker n'en a pas besoin) ---
      # Ajouter l'URL réelle du frontend une fois déployé
      - key: CORS_ORIGINS
        value: https://blueseatra.com,https://blueseatra-frontend.onrender.com

      # --- Taille max upload (15 Mo, specifique a l'API) ---
      - key: MAX_UPLOAD_SIZE
        value: "15728640"

  # ----------------------------------------------------------
  # Worker RQ — traite la file d'extraction durable (opt-in)
  # ----------------------------------------------------------
  # Ajoute le 2026-08-23 : le code de mise en file (backend/server.py
  # _enqueue_extraction, backend/extraction_worker.py) existait deja mais
  # n'avait AUCUN service pour l'executer -- si REDIS_URL avait ete
  # renseignee sans ce worker, les demandes mises en file seraient restees
  # bloquees indefiniment sur "received", sans jamais etre traitees.
  #
  # Ce service reste inoffensif tant que REDIS_URL (ci-dessous) n'est pas
  # renseignee : create_request() retombe alors sur l'ancien comportement
  # in-process et ce worker n'a simplement rien a traiter. Necessite un
  # plan Render supportant les Background Workers (pas disponible sur le
  # plan gratuit).
  - type: worker
    name: blueseatra-extraction-worker
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python extraction_worker.py

    envVars:
      - fromGroup: blueseatra-shared

      # Memes secrets que blueseatra-api ci-dessus : extraction_worker.py
      # importe server.py, qui a besoin de la meme config complete pour
      # relire la demande en base et lancer le pipeline d'extraction.
      - key: DATABASE_URL
        sync: false

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: APP_ENCRYPTION_KEY
        sync: false

      - key: HERMES_API_KEY
        sync: false

      - key: HERMES_GATEWAY_KEY
        sync: false

      # DOIT etre la meme valeur Redis que blueseatra-api : c'est le worker
      # qui consomme la file que l'API remplit.
      - key: REDIS_URL
        sync: false

  # ----------------------------------------------------------
  # Frontend (décommenter si hébergé sur Render)
  # Laisser commenté si le frontend est sur Vercel / Netlify
  # ----------------------------------------------------------
  # - type: web
  #   name: blueseatra-frontend
  #   runtime: static
  #   region: frankfurt
  #   plan: starter
  #   rootDir: frontend
  #   buildCommand: npm install && npm run build
  #   staticPublishPath: ./dist
